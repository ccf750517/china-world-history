function renderText(){const li=visible().map(([_,e])=>`<li><strong>${e.name}</strong> — ${e.type}。${e.min}</li>`).join("");let ex="";if(state.period==="P2")ex="<h3>主要活動方向</h3><p>王室向江漢方向有軍事活動；此路線不表示永久控制區。</p>";if(state.period==="P5")ex="<h3>政治轉換</h3><p>王室政治網絡出現分支並向東轉移。</p>";$("#textMapBody").innerHTML=`<p><strong>${pObj().full}</strong></p><ul>${li}</ul>${ex}`}
function renderContent(){const h=$("#contentList");h.innerHTML="";const map={P1:["hezun","ligui","dayuding","yihou"],P2:["hezun","shiyou"],P3:["shiyou"],P4:["shiyou"],P5:["beacon","transition"]};(map[state.period]||[]).forEach(id=>{const d=D[id],b=document.createElement("button");b.innerHTML=`<strong>${d.name}</strong><span class="meta">${d.type}</span>`;b.onclick=()=>openDetail(id,b);h.appendChild(b)});if(state.period==="P2"){const b=document.createElement("button");b.innerHTML='<strong>昭王南征</strong><span class="meta">軍事活動｜重建／概略路線</span>';b.onclick=()=>openCustom({name:"昭王南征",type:"軍事活動",min:"周王室向江漢方向多次展開軍事活動。",unc:"具體路徑依證據強弱分段呈現；路線不自動形成疆域。",ev:"以軍事路線／方向帶呈現，不生成 political polygon。"},b);h.appendChild(b)}if(state.period==="P4"){const b=document.createElement("button");b.innerHTML='<strong>共和</strong><span class="meta">政治階段｜不是王</span>';b.onclick=()=>openCustom({name:"共和",type:"政治階段",min:"共和位於厲王與宣王之間，使用 Political Phase Component，而不是 King Card。",unc:"起始絕對年代在不同年代模型中可有差異。",ev:"王序與絕對年代模型分離。"},b);h.appendChild(b)}}
function renderView(){const t=$("#contentTitle"),h=$("#contentList");if(state.view==="map"){t.textContent="本期重點";renderContent();return}h.innerHTML="";if(state.view==="time"){t.textContent="時間";h.innerHTML='<div class="card"><strong>王序</strong><span class="meta">武→成→康→昭→穆→共→懿→孝→夷→厲→〔共和：政治階段〕→宣→幽</span></div>'}else if(state.view==="events"){t.textContent="事件";const a=document.createElement("button");a.innerHTML='<strong>後世敘事</strong><span class="meta">烽火戲諸侯不與 Primary Event 同級。</span>';a.onclick=()=>openDetail("beacon",a);h.appendChild(a)}else if(state.view==="people"){t.textContent="人物";h.innerHTML='<div class="card"><strong>人物元件測試</strong><span class="meta">身分／親屬／稱號／官職／後世記憶分欄。</span></div>'}else{t.textContent="制度";["冊命","王官","宗族與繼承","婚姻政治","禮器與身分"].forEach(x=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<strong>${x}</strong><span class="meta">制度入口</span>`;h.appendChild(d)})}}
function renderAll(){$("#periodChip").textContent=`${state.period} ${pObj().short.replace(/<br>/g,"／")}`;$("#modeChip").textContent=state.mode;$("#mode").textContent=state.mode==="GENERAL"?"G":state.mode==="EVIDENCE"?"E":"R";$("#ctxTitle").textContent=pObj().full;$("#ctxText").textContent=pObj().context;renderPeriods();renderMap();renderNodes();renderText();renderView();$$('.bottom button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false'))}
function openEntity(id,tr){const e=E[id];openCustom({name:e.name,type:e.type,min:e.min,unc:e.conf==="尚有爭議"?"位置或解釋尚有爭議；General 模式不硬定。":"請查看證據與脈絡。",ev:`Confidence：${e.conf}。Visual Map 與 Accessible List 共用同一 Entity projection。`},tr)}function openDetail(id,tr){openCustom(D[id],tr)}
function openCustom(d,tr){lastTrigger=tr;state.sheet="PEEK";$("#sheet").classList.remove("hidden","read","full");$("#sheet").classList.add("peek");$("#scrim").classList.remove("hidden");$("#sheetTitle").textContent=d.name;$("#sheetBack").classList.add("hidden");$("#sheetBody").innerHTML=`<p><strong>${d.type}</strong></p><p>${d.min}</p><div class="notice"><strong>尚需注意</strong><br>${d.unc||"請看脈絡。"}</div><div class="sheet-actions"><button id="readMore">展開閱讀</button><button id="evidence">查看證據</button></div>`;$("#readMore").onclick=()=>setSheet("READ");$("#evidence").onclick=()=>showEvidence(d);setTimeout(()=>$("#sheetClose").focus(),0)}
function setSheet(l){state.sheet=l;const s=$("#sheet");s.classList.remove("peek","read","full");s.classList.add(l.toLowerCase());if(l==="FULL"){s.setAttribute("role","dialog");s.setAttribute("aria-modal","true")}else{s.removeAttribute("role");s.removeAttribute("aria-modal")}}
function showEvidence(d){setSheet("FULL");$("#sheetBack").classList.remove("hidden");$("#sheetTitle").textContent=`${d.name}｜證據`;const img=state.imgFail?'<div class="notice">圖片暫時無法顯示。文字證據仍可閱讀。</div>':`<div class="card" role="img" aria-label="${d.name}相關影像測試區">影像區域（已預留尺寸）</div>`;$("#sheetBody").innerHTML=`${img}<h3>Minimum Claim</h3><p>${d.min}</p><h3>Uncertainty</h3><p>${d.unc||"請看脈絡。"}</p><h3>Evidence / Binding</h3><p>${d.ev||"Evidence 必須對應 Claim。"}</p><h3>Research Projection</h3><p>${state.mode==="RESEARCH"?"Research 模式可展開更多資料，但不改寫 General 命題。":"目前不是 Research 模式。"}</p><p style="min-height:340px">長 Evidence 捲動測試區：請在 Safari 工具列展開／收合時上下捲動，確認 sticky header、Bottom Sheet、Back／Close 與 safe area 均正常。</p>`}
function closeSheet(){state.sheet="CLOSED";$("#sheet").classList.add("hidden");$("#scrim").classList.add("hidden");$("#sheet").removeAttribute("role");$("#sheet").removeAttribute("aria-modal");if(lastTrigger&&document.contains(lastTrigger))setTimeout(()=>lastTrigger.focus(),0)}

// M8.1 gesture tests: Bottom Sheet drag + Period Rail horizontal swipe.
let sheetDrag=null;
$(".handle").addEventListener("pointerdown",e=>{
  if(state.sheet==="CLOSED")return;
  sheetDrag={y:e.clientY,start:state.sheet};
  e.currentTarget.setPointerCapture?.(e.pointerId);
});
$(".handle").addEventListener("pointerup",e=>{
  if(!sheetDrag)return;
  const dy=e.clientY-sheetDrag.y;
  const order=["PEEK","READ","FULL"];
  let i=order.indexOf(sheetDrag.start);
  if(dy<-45)i=Math.min(2,i+1);
  if(dy>45)i=Math.max(0,i-1);
  setSheet(order[i]);
  sheetDrag=null;
});
let periodDrag=null;
$("#periodGroup").addEventListener("pointerdown",e=>{periodDrag={x:e.clientX};});
$("#periodGroup").addEventListener("pointerup",e=>{
  if(!periodDrag||state.sheet!=="CLOSED")return;
  const dx=e.clientX-periodDrag.x;periodDrag=null;
  if(Math.abs(dx)<45)return;
  const i=periods.findIndex(x=>x.id===state.period);
  const ni=dx<0?Math.min(4,i+1):Math.max(0,i-1);
  if(ni!==i)commitPeriod(periods[ni].id);
});
$("#sheetClose").onclick=closeSheet;$("#scrim").onclick=()=>state.sheet==="PEEK"&&closeSheet();$("#sheetBack").onclick=()=>{setSheet("READ");$("#sheetBack").classList.add("hidden");$("#sheetBody").innerHTML='<p>已返回節點閱讀層。</p>'};$("#mode").onclick=()=>{const o=["GENERAL","EVIDENCE","RESEARCH"];state.mode=o[(o.indexOf(state.mode)+1)%3];renderAll();announce(`已切換至${state.mode}模式`)};$("#layer").onclick=e=>openCustom({name:"圖層",type:"Layer Sheet",min:"政治 ON｜事件 ON｜考古 OFF｜路線 OFF｜證據 OFF",unc:"概念層一次只允許一個；圖層狀態不改寫歷史資料。",ev:"用於測試 Sheet ownership 與 44px 控制。"},e.currentTarget);$("#locate").onclick=()=>announce(`已定位${pObj().full}`);$("#textBtn").onclick=()=>{state.text=!state.text;$("#textMap").classList.toggle("hidden",!state.text);if(state.text){renderText();$("#textMap").focus()}};$$('.bottom button').forEach(b=>b.onclick=()=>{if(state.sheet!=="CLOSED")closeSheet();state.view=b.dataset.view;renderAll()});$("#back").onclick=()=>announce("返回總時間軸邏輯已觸發；此單檔測試版未接總時間軸。")
function diag(){const vv=visualViewport;const o={RC:"WZ-RC-v0.1",UA:navigator.userAgent,inner:`${innerWidth} × ${innerHeight}`,visualViewport:vv?`${Math.round(vv.width)} × ${Math.round(vv.height)} @ ${vv.scale.toFixed(2)}`:"unsupported",DPR:devicePixelRatio,orientation:screen.orientation?.type||(innerWidth>innerHeight?"landscape":"portrait"),reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches,darkMode:matchMedia('(prefers-color-scheme: dark)').matches,online:navigator.onLine,period:state.period,mode:state.mode,view:state.view,sheet:state.sheet,mapFail:state.mapFail,imgFail:state.imgFail};$("#diagOut").textContent=Object.entries(o).map(([k,v])=>`${k}: ${v}`).join("\n")}
$("#diagBtn").onclick=()=>{$("#diag").classList.remove("hidden");diag();$("#closeDiag").focus()};$("#closeDiag").onclick=()=>{$("#diag").classList.add("hidden");$("#diagBtn").focus()};$("#refreshDiag").onclick=diag;$("#mapFail").onclick=()=>{state.mapFail=!state.mapFail;renderAll();diag()};$("#imgFail").onclick=()=>{state.imgFail=!state.imgFail;diag()};$("#rapid").onclick=()=>{["P1","P2","P4","P5"].forEach((p,i)=>setTimeout(()=>commitPeriod(p),i*35));setTimeout(diag,350)};$("#reset").onclick=()=>{Object.assign(state,{period:"P1",mode:"GENERAL",view:"map",sheet:"CLOSED",mapFail:false,imgFail:false,text:false});closeSheet();$("#textMap").classList.add("hidden");renderAll();diag()};addEventListener('resize',diag);visualViewport?.addEventListener('resize',diag);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$("#diag").classList.contains('hidden'))$("#diag").classList.add('hidden');else if(state.sheet!=="CLOSED")closeSheet()}});renderAll();
})();
</script>
